[core]
copyFrom: aaBeamGunship.ini
name: aaBeamGunship_afterburn
energyRegen: -0.02
afterburn_trail_image: aa_trail.png
[movement]
moveSpeed: 2.3
moveAccelerationSpeed: 0.13
moveDecelerationSpeed: 0.13
maxTurnSpeed: 1.5
turnAcceleration: 0.1
[turret_1]
energyUsage: 99
idleSweepAngle: 0
[action_afterBurn]
resourceAmount: IGNORE
resourceAmount_setValue: IGNORE
[action_cancelBurn]
