[core]
copyFrom: base.ini
name: mounted_tank

[turret_base]
@copyFromSection: template_gun
canShoot: false
limitingMinRange: 300
delay: 75

[turret_independent]
@copyFromSection: template_gun
x: -18
attachedTo: base
